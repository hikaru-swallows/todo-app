<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDoリスト</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>ToDoリスト</h1>

        <p id="task-count">未完了タスク：0件</p>

<div class="input-area">
    <input
        type="text"
        id="todo-input"
        placeholder="やることを入力">

    <input
        type="datetime-local"
        id="todo-date">

    <button id="add-btn">
        追加
    </button>
</div>
        <div class="filter-area">

            <button
                class="filter-btn active"
                data-filter="all">
                すべて
            </button>

            <button
                class="filter-btn"
                data-filter="active">
                未完了
            </button>

            <button
                class="filter-btn"
                data-filter="completed">
                完了
            </button>

        </div>

        <ul id="todo-list">
        </ul>

    </div>

    <script src="script.js"></script>

</body>

</html>
